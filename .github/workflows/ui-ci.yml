name: UI CI Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/ui-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/ui-ci.yml"

jobs:
  ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
          npm run typecheck
