ame: CI Pipeline

# 1. Trigger: Run on pushes or pull requests to the main branch
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 2. Jobs: Define what runs and where
jobs:
  test:
    runs-on: ubuntu-latest

    # 3. Steps: Sequential tasks in the job
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test
